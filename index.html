<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayati 💜</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030006;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.center{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    text-align:center;
    pointer-events:none;
}

.name{
    color:#fff;
    font-size:clamp(45px,12vw,90px);
    font-weight:800;
    letter-spacing:2px;
    text-shadow:
        0 0 8px #ff9acb,
        0 0 20px #ff4fa3,
        0 0 45px #a855f7,
        0 0 80px #8a2be2;
    animation:glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow{
    from{
        transform:scale(1);
        filter:brightness(1);
    }
    to{
        transform:scale(1.045);
        filter:brightness(1.25);
    }
}
</style></head><body><canvas id="canvas"></canvas>

<div class="center">
    <div class="name">Hayati 💜</div>
</div><script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W,H,DPR;

function resize(){

    DPR = Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

resize();
window.addEventListener("resize",resize);


/* =========================
   HEART EQUATION
========================= */

function heart(t){

    return {
        x:16*Math.pow(Math.sin(t),3),

        y:-(13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t))
    };
}


/* =========================
   PARTICLES
========================= */

const particles = [];

const count =
    W < 600 ? 320 : 650;

class Particle{

    constructor(){

        this.reset(true);
    }

    reset(initial=false){

        this.t =
            Math.random()*Math.PI*2;

        this.offset =
            Math.random()*Math.PI*2;

        this.speed =
            0.00015 +
            Math.random()*0.00055;

        this.size =
            W < 600
            ? 7 + Math.random()*5
            : 9 + Math.random()*7;

        this.alpha =
            0.35 +
            Math.random()*0.65;

        this.pink =
            Math.random() > 0.48;

        this.drift =
            Math.random()*18;

        this.twinkle =
            Math.random()*Math.PI*2;

        if(initial){

            this.x =
                Math.random()*W;

            this.y =
                Math.random()*H;

        }
    }

    update(time){

        const mobile = W < 600;

        const scale =
            mobile ? 9.5 : 16;

        const pulse =
            1 +
            Math.sin(
                time*0.0018+
                this.offset
            )*0.055;

        const pos =
            heart(
                this.t +
                time*this.speed
            );

        this.x =
            W/2 +
            pos.x*scale*pulse +
            Math.sin(
                time*0.0007+
                this.offset
            )*this.drift;

        this.y =
            H/2 +
            pos.y*scale*pulse +
            Math.cos(
                time*0.0008+
                this.offset
            )*this.drift;

        this.currentAlpha =
            this.alpha *
            (
                0.72 +
                Math.sin(
                    time*0.003+
                    this.twinkle
                )*0.28
            );
    }

    draw(){

        ctx.font =
            `bold ${this.size}px Arial`;

        ctx.textAlign="center";
        ctx.textBaseline="middle";

        const pink =
            "#ff5cad";

        const purple =
            "#b56cff";

        const color =
            this.pink ? pink : purple;

        ctx.fillStyle =
            color;

        ctx.globalAlpha =
            this.currentAlpha;

        ctx.shadowBlur =
            this.size*1.5;

        ctx.shadowColor =
            color;

        ctx.fillText(
            "LOVE",
            this.x,
            this.y
        );

        ctx.globalAlpha=1;
        ctx.shadowBlur=0;
    }
}


for(let i=0;i<count;i++){

    particles.push(
        new Particle()
    );
}


/* =========================
   BACKGROUND STARS
========================= */

const stars = [];

const starCount =
    W < 600 ? 90 : 160;

for(let i=0;i<starCount;i++){

    stars.push({

        x:Math.random()*W,

        y:Math.random()*H,

        size:Math.random()*1.8+0.3,

        phase:Math.random()*Math.PI*2,

        speed:
            0.001+
            Math.random()*0.003
    });
}


/* =========================
   DRAW STARS
========================= */

function drawStars(time){

    stars.forEach(star=>{

        const glow =
            0.25 +
            (
                Math.sin(
                    time*star.speed+
                    star.phase
                )+1
            )/4;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            Math.random() > 0.5
            ? `rgba(255,120,190,${glow})`
            : `rgba(170,100,255,${glow})`;

        ctx.shadowBlur=8;

        ctx.shadowColor =
            "#c45cff";

        ctx.fill();

        ctx.shadowBlur=0;
    });
}


/* =========================
   ANIMATION
========================= */

function animate(time){

    ctx.globalCompositeOperation =
        "source-over";

    ctx.fillStyle =
        "rgba(3,0,6,0.20)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    drawStars(time);

    ctx.globalCompositeOperation =
        "lighter";

    particles.forEach(p=>{

        p.update(time);
        p.draw();

    });

    ctx.globalCompositeOperation =
        "source-over";

    requestAnimationFrame(
        animate
    );
}

requestAnimationFrame(
    animate
);
</script></body>
</html>
